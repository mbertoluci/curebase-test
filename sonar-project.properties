# SonarQube / SonarCloud analysis config, read by the CI "SonarQube scan" step.
#
# Set these for your account before the scan can run:
#   - sonar.projectKey / sonar.organization below (match your Sonar project)
#   - repo secrets SONAR_TOKEN and SONAR_HOST_URL
#     (SONAR_HOST_URL = https://sonarcloud.io for SonarCloud, or your server URL)
sonar.projectKey=mbertoluci_curebase-test
sonar.organization=mbertoluci

# Analyse the three source projects; spec files are classified as tests, not
# production sources, so coverage/duplication are measured on the right code.
sonar.sources=apps/api/src,apps/web/src,libs/contracts/src
sonar.tests=apps/api/src,apps/web/src,libs/contracts/src
sonar.test.inclusions=**/*.spec.ts,**/*.spec.tsx

# Not product code: specs, DI wiring/bootstrap, and build output.
sonar.exclusions=**/*.spec.ts,**/*.spec.tsx,**/*.module.ts,**/main.ts,**/dist/**,**/.next/**,**/test-output/**,**/coverage/**

# Jest emits lcov per project (see each jest.config coverageDirectory).
sonar.javascript.lcov.reportPaths=apps/api/test-output/jest/coverage/lcov.info,libs/contracts/test-output/jest/coverage/lcov.info,coverage/apps/web/lcov.info

sonar.sourceEncoding=UTF-8
