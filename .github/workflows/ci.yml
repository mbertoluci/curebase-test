name: CI

# Runs on every PR (the merge gate) and on pushes to main (post-merge signal).
on:
  push:
    branches: [main]
  pull_request:

# Least-privilege by default; the Sonar step reads PR metadata to decorate it.
permissions:
  contents: read
  pull-requests: read

# A newer push to the same ref cancels the in-flight run - no wasted minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Single required status check: "verify". Branch protection requires this to
  # pass before a PR can merge (see .github/branch-protection.md).
  verify:
    name: verify
    runs-on: ubuntu-latest

    # The api suite includes repository integration tests against a real
    # Postgres. The DB guard only allows a local host, so the service is reached
    # at localhost and DATABASE_URL points there.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bmi
          POSTGRES_PASSWORD: bmi
          POSTGRES_DB: bmi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bmi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://bmi:bmi@localhost:5432/bmi?schema=public
      # Supplied via repo secrets; the Sonar step is skipped when absent so the
      # pipeline stays green on forks and before the token is configured.
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

    steps:
      - uses: actions/checkout@v5
        with:
          # Full history so Sonar can attribute blame/new-code accurately.
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prettier (format check)
        run: npx prettier --check "**/*.{ts,tsx,js,jsx,cjs,mjs,json,css,md,yml,yaml}"

      - name: Lint
        run: npx nx run-many -t lint --skip-nx-cache

      - name: Typecheck
        run: npx nx run-many -t typecheck --skip-nx-cache

      # The Prisma client is generated by the postinstall hook on npm ci (so it
      # exists before typecheck); here we only apply migrations, which needs the DB.
      - name: Apply database migrations
        run: npx prisma migrate deploy --schema apps/api/prisma/schema.prisma

      - name: Test (with coverage)
        run: npx nx run-many -t test --skip-nx-cache

      - name: Build
        run: npx nx run-many -t build --skip-nx-cache

      # SonarQube / SonarCloud static analysis + coverage upload. Reads
      # sonar-project.properties. Skipped automatically when SONAR_TOKEN is unset.
      - name: SonarQube scan
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: sonarsource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ env.SONAR_HOST_URL }}
